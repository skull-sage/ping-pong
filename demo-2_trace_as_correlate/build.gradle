plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7' apply false
}

allprojects {
    group = 'com.pingpong'
    version = '0.0.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        // Uses the locally installed JDK 25 (Gradle 9.1+ supports running/toolchain on Java 25).
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        // Spring Boot BOM imported the Gradle-native way (platform), so no version numbers are
        // needed anywhere and we avoid the io.spring.dependency-management plugin (Gradle-9 safe).
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.7')
        testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.7')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

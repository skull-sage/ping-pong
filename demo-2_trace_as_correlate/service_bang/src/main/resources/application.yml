spring:
  application:
    name: service-bang
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: service-bang
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    baggage:
      # Saga id propagates in as Baggage and mirrors into the "correlationId" MDC field, so bang's
      # logs show it automatically. trace_id remains the correlator.
      remote-fields:
        - correlationId
      correlation:
        fields:
          - correlationId
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 5s
  opentelemetry:
    resource-attributes:
      service.namespace: pingpong
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs

logging:
  pattern:
    # Service name + single trace_id/span_id (auto-populated by Micrometer Tracing) + business ids,
    # so an ERROR line alone is enough to back-trace: paste the traceId into Tempo for the full flow.
    level: "%5p [${spring.application.name:-}] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] [corr=%X{correlationId:-}, cause=%X{causationId:-}]"
